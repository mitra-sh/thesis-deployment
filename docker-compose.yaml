version: '3.9'
x-supervisor-template: &supervisor-template
  image: mitrash/custom-storm:last
#  command: ["/entrypoint.sh"]
  volumes:
    - /home/as00750/images:/images
    - /var/run/docker.sock:/var/run/docker.sock  

  depends_on:
    - nimbus
    - zookeeper

services:  
  zookeeper:
    image: zookeeper
    hostname: zookeeper
    restart: always
    environment:
      ZOO_TICK_TIME: 3000
    deploy:
      replicas: 1  # Only one Zookeeper instance is needed
      placement:
        constraints:
          - node.role == manager  # Run Zookeeper on the manager node
    networks:
      - storm-net  
  nimbus:
    image: mitrash/custom-storm:last
    hostname: nimbus
    environment:
      - STORM_ROLE=nimbus
      - NODE_HOSTNAME={{.Node.Hostname}}
    command: ["/entrypoint.sh"] 
    depends_on:
      - zookeeper
      - mosquitto
   # restart: always
    restart: "no"
    ports:
      - 6627:6627
    deploy:
      replicas: 1  # Only one Nimbus instance is needed
      placement:
        constraints:
          - node.role == manager  # Run Nimbus on the manager node
    networks:
      - storm-net
   

  supervisor-2:
    hostname: "{{.Service.Name}}-{{.Task.Slot}}"
    <<: *supervisor-template
    environment:
      - SUPERVISOR_NAME={{.Service.Name}}-{{.Task.Slot}}
      - NODE_HOSTNAME={{.Node.Hostname}}
      - TASK_ID={{.Task.ID}}
      - CONTAINER_NAME={{.Service.Name}}.{{.Task.Slot}}.{{.Task.ID}}
      - STORM_ROLE=supervisor
      - TARGET_VM_NAME=as00750-02
      - VM_IP=192.168.122.169
      - STORM_SUPERVISOR_SCHEDULER_META={"serviceName":"supervisor-2"}
    cap_add: 
      - ALL
    networks:
      storm-net:
         aliases:
          - supervisor-2       

    command: ["/entrypoint.sh"]
    deploy:
      placement:
        constraints:
          - node.role == worker  # Run supervisors on worker nodes
          - node.labels.vmName == as00750-02
      resources:
        limits:
          cpus: '6'
#          memory: 12G
